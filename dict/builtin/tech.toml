# Software and IT terms that the C2K model or letter-by-letter spelling reads
# wrongly or poorly. Every entry was checked against the output without this
# dictionary; terms the model already reads well are left out. Keys match
# case-insensitively, so each key also covers its lowercase spelling, which is
# often what goes wrong (fastapi, macos, chatgpt).
#
# Written for go-yomikae; MIT License, see LICENSE.

