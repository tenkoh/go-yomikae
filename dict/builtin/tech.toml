# Software and IT terms, plus the names and words that come up around them in
# LLM output. Keys match case-insensitively, so each key also covers its
# lowercase spelling (fastapi, macos, chatgpt).
#
# Sections group terms by what they are, not by how the model gets them wrong,
# and each term sits in exactly one section. The dictionary aims to cover the
# well-known terms of each section, so it also lists terms the C2K model would
# read correctly on its own. Acronyms spelled letter by letter (HTTP, SSD) are
# left out, because spelling reads them anyway; they appear only when a
# lowercase or plural form would go wrong (api, APIs).
#
# Readings follow three rules:
#   - No ヴ: write バ, ビ, ブ, ベ, ボ instead (Vue is ビュー, Vim is ビム).
#   - When readings differ, use the one most common in Japanese IT work
#     (SQL is エスキューエル, Azure is アジュール).
#   - Spell acronyms letter by letter unless a word reading is well established
#     (JSON is ジェイソン, NASA is ナサ).
#
# Written for go-yomikae; MIT License, see LICENSE.

