# Units of measure after a number, such as 10g, 2.4GHz, 5km/h and 90℃.
# Patterns see the input after NFKC, so ℃ arrives as °C, ㎏ as kg, µ as μ and
# ² as 2. Units are case sensitive (mg, MB), and one-letter units such as g
# and m would hit ordinary words, so every unit entry is a regex that needs a
# number before it. The leading group keeps a unit from matching inside an
# identifier such as k8s or mp3: the number must start the text or follow a
# character that is not a letter, a digit or a dot. Only multi-letter units
# that cannot be mistaken for words also appear as literals.
#
# Written for go-yomikae; MIT License, see LICENSE.

name = "units"
license = "MIT"
case_sensitive = true

[literal]
"°C" = "度"
GHz = "ギガヘルツ"
MHz = "メガヘルツ"
kHz = "キロヘルツ"
Mbps = "メガビーピーエス"
Gbps = "ギガビーピーエス"
kWh = "キロワットアワー"
mAh = "ミリアンペアアワー"
"km/h" = "キロメートル毎時"
hPa = "ヘクトパスカル"
mmHg = "ミリメートルエイチジー"
GB = "ギガバイト"
TB = "テラバイト"

[[regex]]
id = "mg"
pattern = '(^|[^\p{Latin}\p{Greek}\d.])(\d+(?:\.\d+)?) ?mg\b'
replace = "$1$2ミリグラム"

